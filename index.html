<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衣橱搭配">
<meta name="description" content="拍照记录衣物，按天气和场景推荐每日穿搭">
<title>衣橱搭配</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f7a6d'/%3E%3Cpath d='M32 16a5 5 0 0 1 5 5c0 3-5 4-5 7v2L12 44h40L32 30' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d2321;--sub:#6b736f;--mute:#9aa19d;--line:#e9e6df;--pri:#1f7a6d;--pri2:#e4f1ed;--acc:#ff7a59;--acc2:#fff0eb;--danger:#e5484d;--r:18px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:rgba(245,244,240,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:45;pointer-events:none}
body{overflow-x:hidden;overflow-x:clip;padding-top:var(--sat);padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0);overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.page{display:none;padding:8px 16px calc(100px + var(--sab));max-width:640px;margin:0 auto;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 2px 12px}
.ph h1{margin:0;font-size:26px;letter-spacing:.5px;font-weight:800}
.ph .sub{color:var(--sub);font-size:13px;margin-top:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec-t{font-weight:700;font-size:16px;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-t small{font-weight:400;color:var(--sub);font-size:12px}
.muted{color:var(--sub)}.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:14px;background:var(--pri);color:#fff;font-weight:600;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--acc2);color:#d4532f}
.btn.danger{background:#fdecec;color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip.big{height:40px;border-radius:20px;padding:0 15px}
.wx{background:linear-gradient(135deg,#1f7a6d,#2f9c8a 60%,#56b8a2);color:#fff;position:relative;overflow:hidden}
.wx:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.wx .city{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.95;position:relative;z-index:1}
.wx .city button{color:#fff;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:12px;font-size:12px}
.wx .main{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.wx .temp{font-size:54px;font-weight:300;line-height:1;letter-spacing:-2px}
.wx .temp sup{font-size:22px;letter-spacing:0;vertical-align:top;margin-left:2px}
.wx .ico{font-size:52px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.wx .cond{font-size:15px;opacity:.95}
.wx .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;position:relative;z-index:1}
.wx .grid div{background:rgba(255,255,255,.14);border-radius:12px;padding:7px 4px;text-align:center;font-size:11px;opacity:.95}
.wx .grid b{display:block;font-size:14px;font-weight:600}
.wx .tip{margin-top:10px;font-size:13px;background:rgba(0,0,0,.12);border-radius:12px;padding:8px 10px;position:relative;z-index:1}
.skel{background:linear-gradient(90deg,#eee 25%,#f6f6f6 50%,#eee 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.of{padding:14px}
.of-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.of-h b{font-size:16px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;background:var(--pri2);color:var(--pri);font-weight:600}
.badge.o{background:var(--acc2);color:#d4532f}
.of-items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.of-items.n2{grid-template-columns:repeat(2,1fr)}
.of-it{position:relative;border-radius:14px;overflow:hidden;background:#f1efea;aspect-ratio:1}
.of-it img,.thumb img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.of-it span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reason{margin:12px 0;font-size:13.5px;color:#3d4542;background:#f7f6f2;border-radius:12px;padding:10px 12px;line-height:1.65}
.reason p{margin:0}
.of.done{outline:2px solid var(--pri)}
.empty{text-align:center;padding:30px 16px;color:var(--sub)}
.empty .e{font-size:44px;margin-bottom:6px}
.hint{background:var(--acc2);color:#a3462a;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.6}
.hint b{color:#c4471f}
.hint.g{background:var(--pri2);color:#1d5f55}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:transparent;height:40px;font-size:16px;min-width:0}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 12px}
.filters select{width:100%;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;padding:0 6px;font-size:13px;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.filters select.on{border-color:var(--pri);color:var(--pri);background:var(--pri2);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px) and (max-width:759px){.grid2{grid-template-columns:repeat(3,1fr)}}
.it{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.it .thumb{aspect-ratio:1;background:#f1efea;position:relative}
.it .fav{position:absolute;right:8px;top:8px;font-size:16px}
.it .wc{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(255,255,255,.9);border-radius:9px;padding:1px 7px;color:var(--sub)}
.it .demo{position:absolute;left:8px;top:8px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:1px 6px}
.it .meta{padding:9px 11px 11px}
.it .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sm{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12);flex:none;vertical-align:-1px}
.ph-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px}
.f-photo{border-radius:var(--r);background:#fff;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.f-photo .pv{aspect-ratio:4/3;background:#f1efea;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--sub);gap:6px}
.f-photo .pv img{width:100%;height:100%;object-fit:contain}
.f-photo .acts{display:flex;gap:8px;padding:12px}
.f-photo .acts .btn{flex:1}
.fld{margin-bottom:16px}
.fld>label,.lbl{display:block;font-size:13px;color:var(--sub);margin-bottom:7px;font-weight:600}
.lbl em{font-style:normal;color:var(--danger)}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:16px;outline:0}
.inp:focus{border-color:var(--pri)}
textarea.inp{height:72px;padding:10px 12px;resize:vertical}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);padding:4px 0;border-radius:12px}
.sw button i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block;transition:transform .15s}
.sw button.on{background:var(--pri2);color:var(--pri);font-weight:700}
.sw button.on i{transform:scale(1.1);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--pri)}
.warm{display:flex;gap:6px}
.warm button{flex:1;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.warm button b{font-size:16px;color:var(--ink)}
.warm button.on{background:var(--acc);border-color:var(--acc);color:#fff}.warm button.on b{color:#fff}
.sw-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;height:48px;padding:0 12px;margin-bottom:10px}
.tog{width:48px;height:28px;border-radius:14px;background:#d9d6cf;position:relative;transition:.2s;flex:none}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--pri)}.tog.on:after{left:23px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detect{font-size:12px;margin-top:8px;color:var(--pri)}
.sticky-save{position:sticky;bottom:calc(76px + var(--sab));display:flex;gap:10px;padding-top:6px;z-index:5}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:.3px}
.kpi span{font-size:12px;color:var(--sub)}
.kpi.p{background:linear-gradient(135deg,#1f7a6d,#38a08c);color:#fff}.kpi.p span{color:rgba(255,255,255,.85)}
.bars .b{display:grid;grid-template-columns:64px 1fr 38px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bars .tr{height:12px;background:#f0eee8;border-radius:6px;overflow:hidden}
.bars .fl{height:100%;border-radius:6px;background:var(--pri);transition:width .6s}
.bars .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.donut{display:flex;align-items:center;gap:16px}
.legend{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
.legend div{display:flex;align-items:center;gap:5px;white-space:nowrap}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .thumb,.mini{width:44px;height:44px;border-radius:10px;overflow:hidden;background:#f1efea;flex:none;display:block}
.rank .grow{min-width:0}.rank .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .mi{flex:none;width:76px;text-align:center;font-size:11px;color:var(--sub)}
.hscroll .mi .mini{width:76px;height:76px;border-radius:14px;margin-bottom:4px}
.seg{display:flex;background:#ebe8e1;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:10px;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border:0}
.li .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--pri2);flex:none}
.li .grow b{display:block;font-weight:600;font-size:15px}
.li .grow span{font-size:12px;color:var(--sub)}
.li .arr{color:var(--mute)}
.li.red b{color:var(--danger)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-top:1px solid rgba(0,0,0,.06);display:flex;padding:6px 4px calc(6px + var(--sab));z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--pri);font-weight:600}
.tab .add{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1f7a6d,#36a18c);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 6px 16px rgba(31,122,109,.4);border:4px solid var(--bg)}
.tab .add svg{stroke:#fff;stroke-width:2.4}
.mask{position:fixed;inset:0;background:rgba(20,24,22,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:22px 22px 0 0;z-index:61;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d3d0c8;margin:8px auto 4px;flex:none}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;flex:none}
.sheet .sh-h b{font-size:17px}
.sheet .sh-b{overflow-y:auto;padding:0 16px calc(20px + var(--sab));-webkit-overflow-scrolling:touch}
.x{width:32px;height:32px;border-radius:50%;background:#e8e5de;font-size:18px;line-height:32px;text-align:center;color:var(--sub)}
.det-img{border-radius:var(--r);overflow:hidden;background:#f1efea;aspect-ratio:1;margin:0 auto 12px;max-height:46vh}
.det-img img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:84px 1fr;gap:9px 10px;font-size:14px;margin:0}
.kv dt{color:var(--sub)}.kv dd{margin:0;word-break:break-all}
.res{display:block;width:100%;text-align:left;padding:12px 14px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.res b{display:block}.res span{font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:rgba(29,35,33,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
.spin.d{border-color:rgba(0,0,0,.12);border-top-color:var(--pri)}
@keyframes rot{to{transform:rotate(360deg)}}
.hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.hist .d{width:70px;font-size:12px;color:var(--sub);flex:none}
.hist .mini{width:38px;height:38px;border-radius:9px}

/* ===== 大屏 / 折叠屏展开（内屏约 880-1000px 宽） ===== */
@media(min-width:760px){
 .page{max-width:1080px;padding-left:28px;padding-right:28px}
 #p-add,#p-settings{max-width:780px}
 #p-stats{max-width:900px}
 .ph h1{font-size:30px}
 .chips.scroll{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 4px}
 .grid2{grid-template-columns:repeat(4,1fr);gap:16px}
 .filters{grid-template-columns:repeat(5,1fr)}
 #recBox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
 #recBox>*{margin:0}
 #recBox>.hint,#recBox>#shuffle,#recBox>.tiny,#recBox>.empty,#recBox>.skel{grid-column:1/-1}
 #recBox>#shuffle{max-width:360px;justify-self:center;width:100%}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .wx .grid div{padding:10px 4px}
 .sheet{max-width:720px}
 .det-img{max-width:420px}
 .tabbar{justify-content:center}
 .tab{max-width:150px}
 .toast{bottom:calc(110px + var(--sab))}
}
@media(min-width:1100px){
 #recBox{grid-template-columns:repeat(3,minmax(0,1fr))}
 .grid2{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<section class="page on" id="p-today">
  <div class="ph"><div><h1>今日搭配</h1><div class="sub" id="todayDate"></div></div><div id="todayBadge"></div></div>
  <div id="wxBox"></div>
  <div class="sec-t">今天的场景 <small id="occDesc"></small></div>
  <div class="chips scroll" id="occChips"></div>
  <div class="sec-t">风格偏好 <small id="styDesc">可多选</small></div>
  <div class="chips scroll" id="styChips"></div>
  <div id="recBox" style="margin-top:14px"></div>
</section>
<section class="page" id="p-closet">
  <div class="ph"><div><h1>我的衣橱</h1><div class="sub" id="closetSub"></div></div><button class="btn sm ghost" data-go="add">＋ 添加</button></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="搜索名称、品牌、备注…" autocomplete="off"></div>
  <div class="chips scroll" id="catChips"></div>
  <div class="filters" id="filters"></div>
  <div id="closetGrid"></div>
</section>
<section class="page" id="p-add">
  <div class="ph"><div><h1 id="formTitle">添加衣物</h1><div class="sub">拍照记录你的每一件衣服</div></div></div>
  <div id="formBox"></div>
</section>
<section class="page" id="p-stats">
  <div class="ph"><div><h1>衣橱统计</h1><div class="sub">了解你的穿衣习惯</div></div></div>
  <div id="statsBox"></div>
</section>
<section class="page" id="p-settings">
  <div class="ph"><div><h1>设置</h1><div class="sub">数据保存在本机浏览器中</div></div></div>
  <div id="setBox"></div>

function recommend(c,shuffle){

 for(const it of S.items)pools[slotOf(it)].push({it,sc:scoreItem(it,c)});
 for(const k in pools)pools[k].sort((a,b)=>b.sc-a.sc);
 const hasTwo=pools.top.length&&pools.bottom.length,hasOne=pools.one.length;
 if(!hasTwo&&!hasOne)return[];

async function logOutfit(ids,key){
 const td=todayStr();const prev=S.logs.find(l=>l.date===td);const changed=[];
 if(prev)for(const id of prev.ids){if(ids.includes(id))continue;const it=byId(id);if(it){it.wears=(it.wears||[]).filter(d=>d!==td);changed.push(it)}}
 for(const id of ids){const it=byId(id);if(it&&!(it.wears||[]).includes(td)){it.wears=[...(it.wears||[]),td];changed.push(it)}}
 const log={date:td,ids,key,occ:S.occ,ts:Date.now()};
 S.logs=S.logs.filter(l=>l.date!==td).concat(log);
 await DB.putMany('items',changed);await DB.put('logs',log);
}

/* ===== 定位 / 城市 ===== */
function canGeo(){return !!navigator.geolocation&&window.isSecureContext&&location.protocol!=='file:'}
function locate(){
 if(!canGeo()){toast('当前环境不支持定位，请手动搜索城市');openCitySheet();return}
 S.wxState='locating';renderWx();
 navigator.geolocation.getCurrentPosition(async p=>{
  const lat=+p.coords.latitude.toFixed(3),lon=+p.coords.longitude.toFixed(3);let name='当前位置';
  try{const r=await fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`,5000);name=r.city||r.locality||r.principalSubdivision||name}catch(e){}
  setCity({name,lat,lon,auto:true});
 },err=>{console.warn('定位失败',err.message);toast(err.code===1?'定位权限被拒绝，请手动搜索城市':'定位失败，请手动搜索城市');S.wxState=S.city?'idle':'nocity';if(S.city)loadWeather();else renderWx();openCitySheet()},{timeout:10000,maximumAge:30*60e3});
}
function setCity(c){S.city=c;LS.set('city',c);closeSheet();loadWeather(true);if(S.page==='settings')renderSettings()}

 openSheet('选择城市',`<div class="search"><span>🔍</span><input id="cityQ" placeholder="输入城市名，如：杭州、成都" enterkeyhint="search"></div>
 <div class="row" style="margin-bottom:12px"><button class="btn grow" id="citySearch">搜索</button>${canGeo()?'<button class="btn ghost grow" id="cityGeo">📍 使用当前定位</button>':''}</div>
 ${canGeo()?'':'<div class="hint g">本地文件模式下浏览器不允许定位，请输入城市名搜索。通过 https 链接打开时可自动定位。</div>'}

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function processImage(file){
 const src=URL.createObjectURL(file);
 try{const im=await loadImg(src);const MAX=800;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
  return{url:c.toDataURL('image/jpeg',.82),color:detectColor(c)}}finally{URL.revokeObjectURL(src)}
}
function detectColor(src){
 const N=64,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(src,0,0,N,N);
 const d=g.getImageData(0,0,N,N).data;const px=(x,y)=>{const i=(y*N+x)*4;return[d[i],d[i+1],d[i+2]]};
 let br=[0,0,0],bn=0;for(let i=0;i<N;i++)for(const p of[px(i,0),px(i,N-1),px(0,i),px(N-1,i)]){br[0]+=p[0];br[1]+=p[1];br[2]+=p[2];bn++}br=br.map(v=>v/bn);
 const dist=(a,b)=>Math.sqrt((a[0]-b[0])**2*.3+(a[1]-b[1])**2*.59+(a[2]-b[2])**2*.11);
 const buckets=new Map();
 for(let y=Math.floor(N*.15);y<N*.85;y++)for(let x=Math.floor(N*.15);x<N*.85;x++){const p=px(x,y);if(dist(p,br)<28)continue;const k=(p[0]>>5)+','+(p[1]>>5)+','+(p[2]>>5);const b=buckets.get(k)||{n:0,r:0,g:0,b:0};b.n++;b.r+=p[0];b.g+=p[1];b.b+=p[2];buckets.set(k,b)}
 let best=null;for(const b of buckets.values())if(!best||b.n>best.n)best=b;
 if(!best||best.n<20){const p=px(N>>1,N>>1);best={n:1,r:p[0],g:p[1],b:p[2]}}
 const rgb=[best.r/best.n,best.g/best.n,best.b/best.n];
 let bc=null,bd=1e9;for(const [n,h] of COLORS){if(n==='银色'||n==='金色')continue;const q=[1,3,5].map(i=>parseInt(h.substr(i,2),16));const dd=dist(rgb,q);if(dd<bd){bd=dd;bc=n}}
 return bc;
}

function donut(entries,colorFn,unit='件'){
 const tot=entries.reduce((a,e)=>a+e[1],0)||1;let acc=0;const R=52,C=2*Math.PI*R;
 const segs=entries.map(([k,v])=>{const len=v/tot*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${colorFn(k)}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s}).join('');
 return `<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" style="flex:none"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#f0eee8" stroke-width="22"/>${segs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="#1d2321">${tot}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#6b736f">${unit}</text></svg><div class="legend">${entries.map(([k,v])=>`<div><i class="dot" style="background:${colorFn(k)}"></i>${esc(k)} <span class="muted">${v}</span></div>`).join('')}</div></div>`;
}

function exportData(){
 if(IS_APP)return exportNative();
 const data={app:'wardrobe-outfit',version:1,exportedAt:new Date().toISOString(),items:S.items,logs:S.logs,settings:{city:S.city,occ:S.occ,defStyles:LS.get('defStyles',[]),prefStyles:S.prefStyles}};
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const name=`衣橱备份-${todayStr()}.json`;
 const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(`已导出 ${S.items.length} 件衣物`)};
 let file=null;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
 if(file&&navigator.canShare&&/iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'衣橱备份'}).catch(err=>{if(err.name!=='AbortError')dl()})}else dl();
}
function exportNative(){
 openSheet('导出备份',`<div class="muted tiny" style="margin-bottom:12px">备份包含 ${S.items.length} 件衣物（含照片）和 ${S.logs.length} 条穿搭记录。</div>
 <button class="btn block" id="exSave" style="margin-bottom:10px">💾 保存到手机文件</button>
 <button class="btn ghost block" id="exShare">📤 分享到微信 / 其他应用</button>`);
 const send=()=>{const json=JSON.stringify({app:'wardrobe-outfit',version:1,exportedAt:new Date().toISOString(),items:S.items,logs:S.logs,settings:{city:S.city,occ:S.occ,defStyles:LS.get('defStyles',[]),prefStyles:S.prefStyles}});const id=AndroidBridge.begin();for(let i=0;i<json.length;i+=400000)AndroidBridge.append(id,json.slice(i,i+400000));return id};
 const name=`衣橱备份-${todayStr()}.json`;
 $('#exSave').onclick=()=>{closeSheet();AndroidBridge.saveFile(send(),name)};
 $('#exShare').onclick=()=>{closeSheet();AndroidBridge.shareFile(send(),name)};
}
window.__nativeSaved=(ok,msg)=>toast(ok?`✅ 备份已保存：${msg}`:(msg||'已取消保存'),3000);
window.__androidBack=()=>{if($('#sheet').classList.contains('on')){closeSheet();return true}if(S.page!=='today'){S.editing=null;go('today');return true}return false};
window.__setInsets=(t,b)=>{const r=document.documentElement.style;r.setProperty('--sat',t+'px');r.setProperty('--sab',b+'px')};
$('#fileImport').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.items))throw new Error('格式不对');
  const valid=d.items.filter(i=>i&&i.id&&i.cat).map(i=>({...i,wears:Array.isArray(i.wears)?i.wears:[],seasons:i.seasons||[],occasions:i.occasions||[],styleTags:Array.isArray(i.styleTags)?i.styleTags:[]}));
  const replace=S.items.length?confirm(`备份中有 ${valid.length} 件衣物。\n点“确定”覆盖现有数据；点“取消”合并到现有衣橱。`):true;
  if(replace){await DB.clear('items');await DB.clear('logs');S.items=[];S.logs=[]}
  await DB.putMany('items',valid);const logs=(d.logs||[]).filter(l=>l&&l.date&&Array.isArray(l.ids));await DB.putMany('logs',logs);
  const m=new Map(S.items.map(i=>[i.id,i]));valid.forEach(i=>m.set(i.id,i));S.items=[...m.values()];
  const lm=new Map(S.logs.map(l=>[l.date,l]));logs.forEach(l=>lm.set(l.date,l));S.logs=[...lm.values()];
  if(d.settings&&d.settings.city&&!S.city){S.city=d.settings.city;LS.set('city',S.city)}
  toast(`已导入 ${valid.length} 件衣物`);renderSettings();
 }catch(err){console.error(err);toast('导入失败：不是有效的备份文件')}
});

function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return'#'+((f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).padStart(6,'0')}

  if(s==='高跟鞋'){g.beginPath();g.moveTo(-150,-30);g.quadraticCurveTo(-120,-50,-100,-40);g.quadraticCurveTo(0,40,140,40);g.quadraticCurveTo(165,45,160,75);g.lineTo(-30,75);g.quadraticCurveTo(-90,30,-125,20);g.lineTo(-125,110);g.lineTo(-145,110);g.closePath();fs();return}
  if(s==='凉鞋'||s==='拖鞋'){g.beginPath();g.ellipse(0,60,165,30,0,0,Math.PI*2);fs();g.lineWidth=26;g.strokeStyle=shade(base,-25);g.beginPath();g.arc(30,60,60,Math.PI*1.1,Math.PI*1.9);g.stroke();if(s==='凉鞋'){g.beginPath();g.arc(-90,60,45,Math.PI*1.1,Math.PI*1.9);g.stroke()}return}
  if(s==='靴子'||s==='徒步鞋'){const top=s==='靴子'?-150:-70;P([[-140,top],[-50,top],[-40,-40],[40,-10],[130,10],[155,50],[155,80],[-150,80],[-150,top+10]]);fs()}
  else{g.beginPath();g.moveTo(-150,75);g.lineTo(-150,-10);g.quadraticCurveTo(-140,-45,-100,-45);g.lineTo(-40,-55);g.quadraticCurveTo(0,-20,60,-5);g.quadraticCurveTo(150,10,157,50);g.lineTo(157,75);g.closePath();fs()}
  g.fillStyle=s==='皮鞋'||s==='靴子'?'#2a2a2a':'#fafafa';g.fillRect(-152,66,311,20);g.strokeRect(-152,66,311,20);
  if(['运动鞋','跑鞋','休闲鞋','徒步鞋'].includes(s)){g.beginPath();for(let x=-60;x<20;x+=22){g.moveTo(x,-40+(x+60)*.3);g.lineTo(x+25,-20+(x+60)*.3)}g.stroke()}
  return}
 if(s==='包'){rr(g,-130,-40,260,180,24);fs();g.lineWidth=16;g.beginPath();g.arc(0,-40,75,Math.PI,0);g.stroke();return}
 if(s==='帽子'){g.beginPath();g.arc(0,40,120,Math.PI,0);g.closePath();fs();g.beginPath();g.ellipse(90,40,120,22,0,0,Math.PI*2);fs();return}
 if(s==='围巾'){P([[-110,-150],[-20,-150],[-60,40],[-140,30]]);fs();P([[-60,-160],[40,-160],[60,140],[-40,140]]);fs();g.beginPath();for(let x=-40;x<60;x+=14){g.moveTo(x,140);g.lineTo(x+2,170)}g.stroke();return}
 if(s==='雨伞'){g.beginPath();g.moveTo(-160,0);g.quadraticCurveTo(0,-200,160,0);[100,40,-20,-80,-160].forEach(x=>g.quadraticCurveTo(x+30,-25,x,0));g.closePath();fs();g.lineWidth=10;g.beginPath();g.moveTo(0,-5);g.lineTo(0,140);g.arc(-25,140,25,0,Math.PI);g.stroke();return}
 if(s==='手表'){g.fillRect(-35,-170,70,340);g.strokeRect(-35,-170,70,340);g.beginPath();g.arc(0,0,75,0,Math.PI*2);fs();g.fillStyle='#fff';g.beginPath();g.arc(0,0,58,0,Math.PI*2);g.fill();g.strokeStyle='#333';g.beginPath();g.moveTo(0,0);g.lineTo(0,-40);g.moveTo(0,0);g.lineTo(30,10);g.stroke();return}
 if(s==='首饰'){[-70,70].forEach(x=>{g.beginPath();g.arc(x,-90,10,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(x,-80);g.lineTo(x-35,40);g.lineTo(x,110);g.lineTo(x+35,40);g.closePath();fs()});return}
 g.beginPath();g.arc(0,0,110,0,Math.PI*2);fs();
}
function demoImage(it){
 const c=document.createElement('canvas');c.width=c.height=480;const g=c.getContext('2d');
 const col=(COLOR[it.color]||{}).hex||'#999999';
 const grd=g.createLinearGradient(0,0,480,480);grd.addColorStop(0,'#f6f4f0');grd.addColorStop(1,'#e6e1d8');g.fillStyle=grd;g.fillRect(0,0,480,480);
 g.fillStyle='rgba(0,0,0,.06)';g.beginPath();g.ellipse(240,430,150,16,0,0,Math.PI*2);g.fill();
 g.save();g.translate(240,228);g.scale(.92,.92);g.fillStyle=col;g.strokeStyle=shade(col,col==='#1f1f1f'?70:-45);g.lineWidth=5;g.lineJoin='round';g.lineCap='round';drawShape(g,it);g.restore();
 g.fillStyle='rgba(0,0,0,.55)';rr(g,16,16,84,36,18);g.fill();g.fillStyle='#fff';g.font='bold 20px "PingFang SC","Noto Sans CJK SC",sans-serif';g.textAlign='center';g.fillText('示例',58,41);
 return c.toDataURL('image/jpeg',.8);
}
async function loadDemo(){
 if(S.items.some(i=>i.demo)&&!confirm('已有示例衣物，是否重新生成？（会替换旧的示例衣物）'))return;
 toast('正在生成示例衣物…');await new Promise(r=>setTimeout(r,30));
 const old=S.items.filter(i=>i.demo).map(i=>i.id);for(const id of old)await DB.del('items',id);S.items=S.items.filter(i=>!i.demo);
 const td=todayStr();const rnd=mulberry32(20261018);const now=Date.now();
 const items=DEMO.map((d,k)=>{const [name,cat,sub,color,warmth,style,se,oc,wp,brand,price,notes]=d;
  const it={id:'demo-'+k+'-'+uid(),demo:true,name,cat,sub,color,warmth,style,seasons:[...se],occasions:oc.split(','),styleTags:(DEMO_TAGS[name]||'').split(',').filter(Boolean),waterproof:!!wp,brand,price,notes:notes||'示例数据，可编辑或删除',fav:k%9===2,created:now-k*1000,buyDate:addDays(td,-Math.floor(rnd()*700+20)),wears:[]};
  const n=k%7===4?0:Math.floor(rnd()*14);const set=new Set();for(let j=0;j<n;j++)set.add(addDays(td,-Math.floor(rnd()*90+2)));it.wears=[...set].sort();
  it.photo=demoImage(it);return it});
 await DB.putMany('items',items);S.items.push(...items);S.shown.clear();
 toast(`已加载 ${items.length} 件示例衣物 ✨`);refresh();
}

/* ===== 启动 ===== */
(async function init(){
 await DB.open();
 try{S.items=await DB.all('items');S.logs=await DB.all('logs')}catch(e){console.error(e)}
 renderToday();
 if(S.city&&S.city.manual){const mw=LS.get('manualWx',null);if(mw){S.wx=mw;S.wxState='ok'}else S.wxState='nocity';renderWx();renderRecs()}
 else if(S.city)loadWeather();
 else if(canGeo()&&!LS.get('geoAsked',false)){LS.set('geoAsked',true);locate()}
 else{S.wxState='nocity';renderWx();renderRecs()}
 if(IS_APP){const sub=$('#p-settings .sub');if(sub)sub.textContent='数据保存在本应用内';}
 if(location.protocol.startsWith('http')&&!IS_APP){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);
  if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW 注册失败',e));
 }
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.page==='today'&&S.city&&!S.city.manual)loadWeather()});
})();
</script>
